<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Almacén de Perforación</title>
  <meta name="theme-color" content="#007bff">
  <meta name="description" content="App para gestionar salidas de inventario en almacén de perforación">
  <!-- Favicon placeholder -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f8f9fa;
    }
    
    #root {
      min-height: 100vh;
    }
    
    /* Estilos para modo oscuro */
    @media (prefers-color-scheme: dark) {
      body {
        background: #1a1a2e;
        color: #e0e0e0;
      }
      
      .date-selector, .autocomplete-container, form, .form-control, .btn {
        background: #16213e;
        color: #e0e0e0;
        border-color: #2a2a4e;
      }
      
      .form-control {
        background: #16213e;
        color: #e0e0e0;
      }
      
      .autocomplete {
        background: #16213e;
      }
      
      .autocomplete-list .autocomplete-item {
        background: #1a1a2e;
      }
      
      .autocomplete-list .autocomplete-item:hover {
        background: #2a2a4e;
      }
      
      .autocomplete-list .autocomplete-item.low-stock {
        background: #8b5a2b;
        color: #fff;
      }
    }
  </style>
</head>
<body>
  <noscript>
    <div style="padding: 20px; text-align: center; color: #dc3545;">
      <h2>⚠️ JavaScript debe estar habilitado</h2>
      <p>Esta aplicación requiere JavaScript para funcionar.</p>
    </div>
  </noscript>
  
  <div id="root">
    <!-- La app se montará aquí -->
  </div>
  
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
